name: Update village diary

# Runs weekly (catches a new Villager within days) and on-demand from the
# Actions tab. It never commits straight to the site: it opens a pull request
# so a human checks the parsed dates before they go live.
on:
  schedule:
    - cron: "0 7 * * 1"      # Mondays, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape latest newsletter and parse diary dates
        working-directory: scraper
        run: python main.py

      - name: Open a review PR if the dates changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update village diary from latest Villager"
          branch: bot/diary-update
          title: "Village diary: new dates to review"
          body: |
            Automated update from the latest **Villager** newsletter.

            **Please check each date against the PDF before merging** — the
            parser is best-effort and volunteer-written PDFs vary. Look
            especially at event titles and any "suspended"/"no classes" notes.

            Merging republishes the calendar.
          add-paths: site/data/events.json
          delete-branch: true
