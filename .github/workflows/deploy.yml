name: Deploy to GitHub Pages

# Publishes the site/ folder to GitHub Pages on every push to main. Because the
# diary-update PRs land on main when merged, approving new dates redeploys the
# calendar automatically — no separate step.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site          # serve the site/ folder as the site root
      - id: deployment
        uses: actions/deploy-pages@v4
