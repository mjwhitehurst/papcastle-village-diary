<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papcastle Village Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560;9..144,640&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F3EE; --card:#FBFBF8; --ink:#26302A; --muted:#6B7670;
    --fell:#35503F; --fell-soft:#E4EAE3; --gorse:#B5812B; --gorse-soft:#F3E7CC;
    --slate:#61707A; --slate-soft:#E6EAEC; --line:#DBDDD3; --line-strong:#C8CBBE;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Instrument Sans",system-ui,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:clamp(16px,4vw,40px)}

  /* --- Masthead --- */
  header.mast{display:flex; align-items:flex-end; justify-content:space-between;
    gap:20px; flex-wrap:wrap; border-bottom:2px solid var(--fell); padding-bottom:18px}
  .eyebrow{font-size:.72rem; letter-spacing:.22em; text-transform:uppercase;
    color:var(--gorse); font-weight:600; margin:0 0 2px}
  h1{font-family:"Fraunces",serif; font-weight:640; font-size:clamp(1.9rem,5vw,2.9rem);
    line-height:1; margin:0; color:var(--fell); font-optical-sizing:auto}
  .source{font-size:.82rem; color:var(--muted); max-width:34ch; text-align:right}
  .source a{color:var(--slate)}

  /* --- Month nav --- */
  .nav{display:flex; align-items:center; gap:14px; margin:26px 0 10px}
  .nav h2{font-family:"Fraunces",serif; font-weight:560; font-size:clamp(1.3rem,3.4vw,1.7rem);
    margin:0; min-width:8.5ch}
  .nav .spacer{flex:1}
  button.step, button.today{font:inherit; cursor:pointer; border:1px solid var(--line-strong);
    background:var(--card); color:var(--ink); border-radius:var(--radius); padding:8px 12px}
  button.step{width:40px; height:40px; font-size:1.1rem; line-height:1; padding:0}
  button.step:hover,button.today:hover{border-color:var(--fell); color:var(--fell)}
  button.today{font-size:.85rem; padding:8px 14px}
  :focus-visible{outline:2px solid var(--gorse); outline-offset:2px}

  .layout{display:grid; grid-template-columns:1fr 268px; gap:28px; align-items:start}

  /* --- Calendar grid --- */
  .dow{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px}
  .dow span{font-size:.7rem; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); text-align:left; padding:0 6px; font-weight:600}
  .grid{display:grid; grid-template-columns:repeat(7,1fr);
    grid-auto-rows:minmax(96px,auto); gap:6px}
  .cell{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:6px 7px; display:flex; flex-direction:column; gap:5px; min-width:0}
  .cell.pad{background:transparent; border-color:transparent}
  .cell.today{border-color:var(--fell); box-shadow:inset 0 0 0 1px var(--fell)}
  .datenum{font-size:.82rem; color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums}
  /* Today reads as a filled marker, not just a tinted number — the ring alone
     was easy to miss against the cell borders. */
  .cell.today .datenum{color:var(--card); background:var(--fell); font-weight:700;
    align-self:flex-start; min-width:1.45rem; height:1.45rem; padding:0 .3rem;
    border-radius:999px; display:flex; align-items:center; justify-content:center}

  /* Day-cell contents. Everything shows in full; if a day is busy enough that
     the cell would grow past CELL_CONTENT_CAP, fitCell() steps it down a
     level (drop the times, then clamp the titles). Full text always remains
     in the tooltip, the popover and the weekly aside. */
  .stack{flex:1; display:flex; flex-direction:column; gap:5px; min-width:0}
  .regs{margin-top:auto; display:flex; flex-direction:column; gap:4px}
  .regular{font-size:.68rem; color:var(--slate); display:flex; align-items:flex-start;
    gap:5px; opacity:.9; line-height:1.3}
  .regular .tick{width:6px; height:6px; border-radius:50%; background:var(--slate);
    flex:none; margin-top:.4em}
  .regular .r-t{min-width:0; overflow-wrap:anywhere}
  .regular .r-h{display:block; color:var(--muted)}

  .stack.tight-1 .r-h{display:none}
  .stack.tight-2 .r-h{display:none}
  .stack.tight-2 .r-t,
  .stack.tight-2 .ev .t{display:-webkit-box; -webkit-box-orient:vertical;
    overflow:hidden; -webkit-line-clamp:1; line-clamp:1}
  .stack.tight-2 .ev .t{-webkit-line-clamp:2; line-clamp:2}

  .ev{border:none; text-align:left; width:100%; cursor:pointer; font:inherit;
    background:var(--gorse-soft); color:#5c4410; border-left:3px solid var(--gorse);
    border-radius:6px; padding:4px 6px; display:block}
  .ev:hover{filter:brightness(.97)}
  .ev .t{font-weight:600; font-size:.76rem; line-height:1.2; display:block}
  .ev .h{font-size:.68rem; color:#7a5f1c; display:block}

  /* --- Weekly aside --- */
  aside h3{font-family:"Fraunces",serif; font-weight:560; font-size:1.05rem;
    margin:0 0 4px; color:var(--fell)}
  aside .lead{font-size:.78rem; color:var(--muted); margin:0 0 14px}
  .weekly{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
  .weekly li{background:var(--card); border:1px solid var(--line); border-left:3px solid var(--slate);
    border-radius:8px; padding:9px 11px}
  .weekly li.off{border-left-color:var(--line-strong); opacity:.62}
  .weekly .w-t{font-weight:600; font-size:.86rem}
  .weekly .w-m{font-size:.74rem; color:var(--slate)}
  .weekly .w-note{font-size:.72rem; color:var(--muted); margin-top:2px}
  .tag{display:inline-block; font-size:.62rem; letter-spacing:.08em; text-transform:uppercase;
    font-weight:600; color:var(--muted); border:1px solid var(--line-strong);
    border-radius:20px; padding:1px 7px; margin-left:6px}

  /* --- Popover --- */
  .pop{position:fixed; inset:auto; z-index:20; max-width:min(320px,88vw);
    background:var(--card); border:1px solid var(--line-strong); border-top:3px solid var(--gorse);
    border-radius:10px; box-shadow:0 12px 30px rgba(38,48,42,.18); padding:14px 16px}
  .pop h4{font-family:"Fraunces",serif; margin:0 0 2px; font-size:1.05rem; color:var(--fell)}
  .pop .when{font-size:.8rem; color:var(--slate); font-weight:600; margin-bottom:8px}
  .pop p{font-size:.82rem; margin:0; color:var(--ink)}
  .pop button.x{position:absolute; top:8px; right:10px; border:none; background:none;
    font-size:1.1rem; cursor:pointer; color:var(--muted); line-height:1}
  .backdrop{position:fixed; inset:0; z-index:15}

  /* --- Agenda (mobile) --- */
  .agenda{display:none; flex-direction:column; gap:8px}
  .agenda .day{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; display:flex; gap:14px}
  .agenda .d-when{flex:none; width:56px; text-align:center}
  .agenda .d-dow{font-size:.68rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted)}
  .agenda .d-num{font-family:"Fraunces",serif; font-size:1.5rem; color:var(--fell); line-height:1}
  .agenda .d-body .t{font-weight:600}
  .agenda .d-body .h{font-size:.8rem; color:var(--slate)}
  .agenda .empty{color:var(--muted); font-size:.86rem; padding:8px 2px}

  footer{margin-top:30px; padding-top:16px; border-top:1px solid var(--line);
    font-size:.76rem; color:var(--muted)}

  @media (max-width:760px){
    .layout{grid-template-columns:1fr; gap:22px}
    .dow,.grid{display:none}
    .agenda{display:flex}
    .source{text-align:left}
    header.mast{align-items:flex-start}
    aside{order:2}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div>
      <p class="eyebrow">The Villager &middot; Papcastle &amp; Belle Vue</p>
      <h1>Village Diary</h1>
    </div>
    <p class="source" id="source">Loading&hellip;</p>
  </header>

  <div class="nav">
    <button class="step" id="prev" aria-label="Previous month">&lsaquo;</button>
    <h2 id="monthLabel">&nbsp;</h2>
    <button class="today" id="todayBtn">Today</button>
    <button class="step" id="next" aria-label="Next month">&rsaquo;</button>
    <span class="spacer"></span>
  </div>

  <div class="layout">
    <div>
      <div class="dow" aria-hidden="true">
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span>
        <span>Fri</span><span>Sat</span><span>Sun</span>
      </div>
      <div class="grid" id="grid" role="grid" aria-label="Month calendar"></div>
      <div class="agenda" id="agenda"></div>
    </div>

    <aside>
      <h3>Every week in the village</h3>
      <p class="lead">Regular activities at the Village Hall &amp; around Papcastle.</p>
      <ul class="weekly" id="weekly"></ul>
    </aside>
  </div>

  <footer id="footer"></footer>
</div>

<script>
// Embedded fallback so the page renders even before data/events.json exists.
const SAMPLE = {
  "source": {
    "issue": "The Villager Issue 77 Spring 2026 (fixture)",
    "url": "(local fixture)",
    "issue_year": 2026,
    "generated_at": "2026-07-22T15:09:27+00:00"
  },
  "events": [
    {
      "title": "Keep Fit in the Village Hall",
      "kind": "recurring",
      "date": null,
      "weekday": "Monday",
      "time_text": "6.30 - 7.30 pm",
      "notes": "",
      "raw": "Every Monday / 6.30 - 7.30 pm / Keep Fit in the Village Hall. Suspended until Autumn. Please contact / Tony for further details - tony.magorrian@googlemail.com",
      "needs_review": true
    },
    {
      "title": "Papcastle Yoga",
      "kind": "recurring",
      "date": null,
      "weekday": "Thursday",
      "time_text": "6.30 - 7.30 pm",
      "notes": "",
      "raw": "Every Thursday* / 6.30 - 7.30 pm / Papcastle Yoga - with Caroline Alexander - fitflamingoyoga@gmail.com / Continuing throughout August 2026. / * Wednesday 1st July) / (no classes on 7th & 14th May, 18th & 25th June and 30th July).",
      "needs_review": true
    },
    {
      "title": "Divas School of Dance",
      "kind": "recurring",
      "date": null,
      "weekday": "Saturday",
      "time_text": "Class times vary",
      "notes": "",
      "raw": "Every Saturday / Class times vary / Divas School of Dance. Classes for all ages in Ballet, Modern & Tap. / Please contact M Williamson on 07512804184 for further details or email / mandywilliamson72@yahoo.co.uk",
      "needs_review": true
    },
    {
      "title": "Foodie Quiz",
      "kind": "one_off",
      "date": "2026-05-08",
      "weekday": null,
      "time_text": "7.00 pm",
      "notes": "",
      "raw": "Friday, 8th May / 7.00 pm / Foodie Quiz / Bring your own drinks. / Tickets available from Hilary on 07958 957230.",
      "needs_review": true
    },
    {
      "title": "Community Emergency Hub",
      "kind": "one_off",
      "date": "2026-06-12",
      "weekday": null,
      "time_text": "6.30 - 8 pm",
      "notes": "",
      "raw": "Friday 12th June / 6.30 - 8 pm / Community Emergency Hub - Drop In / With Mountain Rescue volunteers",
      "needs_review": true
    },
    {
      "title": "Family Sports Day",
      "kind": "one_off",
      "date": "2026-07-04",
      "weekday": null,
      "time_text": "2-5 pm",
      "notes": "",
      "raw": "Saturday, 4th July / 2-5 pm / Family Sports Day / First River Field. Free. BYOB, picnics and blankets.",
      "needs_review": true
    },
    {
      "title": "SAVE THE DATE",
      "kind": "one_off",
      "date": "2026-07-18",
      "weekday": null,
      "time_text": "6.00 pm",
      "notes": "",
      "raw": "Saturday 18th July / 6.00 pm onwards / SAVE THE DATE - Village BBQ !! / Tickets £15 includes welcome drink. Under 8's free.",
      "needs_review": true
    }
  ]
};

const DOW = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const MON = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const mondayIndex = d => (d.getDay() + 6) % 7;          // 0 = Monday
// Local calendar date, NOT toISOString() — that converts local midnight to UTC,
// which in BST lands on the previous day and shifts every event a day late.
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

let DATA, view, today = new Date(); today.setHours(0,0,0,0);

async function load(){
  try{
    const r = await fetch("./data/events.json", {cache:"no-store"});
    if(!r.ok) throw 0;
    DATA = await r.json();
  }catch(_){ DATA = SAMPLE; }
  start();
}

function start(){
  // Always open on the current month, so "today" is on screen and the calendar
  // agrees with the reader's own sense of where they are in the year. Use the
  // arrows or Today to move; the weekly aside is month-independent.
  view = new Date(today.getFullYear(), today.getMonth(), 1);

  const s = DATA.source || {};
  const when = s.generated_at ? new Date(s.generated_at).toLocaleDateString("en-GB",
                 {day:"numeric",month:"long",year:"numeric"}) : "";
  const link = s.url && s.url.startsWith("http")
      ? `<a href="${s.url}">${s.issue||"the latest Villager"}</a>` : (s.issue||"the latest Villager");
  document.getElementById("source").innerHTML =
      `Dates taken from ${link}${when ? "<br>Updated "+when : ""}`;
  document.getElementById("footer").innerHTML =
      `A community calendar for Papcastle &amp; Belle Vue. Always double-check times against the ` +
      `A-boards, WhatsApp groups and the <a href="https://www.papcastleparishcouncil.gov.uk">Parish Council website</a>.`;

  renderWeekly();
  render();
  document.getElementById("prev").onclick = () => hop(-1);
  document.getElementById("next").onclick = () => hop(1);
  document.getElementById("todayBtn").onclick = () => { view = new Date(today.getFullYear(), today.getMonth(), 1); render(); };
}
function hop(n){ view = new Date(view.getFullYear(), view.getMonth()+n, 1); render(); }

const isSuspended = e => /suspend/i.test(e.raw || "");
function recurringNote(e){
  const notes = [];
  const susp = (e.raw||"").match(/suspended[^.]*/i);
  const skip = (e.raw||"").match(/no classes on[^).]*/i);
  const cont = (e.raw||"").match(/continuing[^.]*/i);
  if(susp) notes.push(susp[0].trim());
  if(cont) notes.push(cont[0].trim());
  if(skip) notes.push("(" + skip[0].trim() + ")");
  return notes.join(" &middot; ");
}

function render(){
  document.getElementById("monthLabel").textContent = `${MON[view.getMonth()]} ${view.getFullYear()}`;
  renderGrid();
  renderAgenda();
}

function eventsOn(dateStr){
  return DATA.events.filter(e => e.kind === "one_off" && e.date === dateStr);
}
function regularsOn(weekday){
  return DATA.events.filter(e => e.kind === "recurring" && e.weekday === weekday && !isSuspended(e));
}

function renderGrid(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const stacks = [];
  const first = new Date(view.getFullYear(), view.getMonth(), 1);
  const daysIn = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
  const lead = mondayIndex(first);
  for(let i=0;i<lead;i++){ const c=document.createElement("div"); c.className="cell pad"; grid.appendChild(c); }

  for(let day=1; day<=daysIn; day++){
    const d = new Date(view.getFullYear(), view.getMonth(), day);
    const cell = document.createElement("div");
    const isToday = iso(d) === iso(today);
    cell.className = "cell" + (isToday ? " today" : "");
    cell.setAttribute("role","gridcell");
    if(isToday) cell.setAttribute("aria-current","date");

    const num = document.createElement("div");
    num.className = "datenum"; num.textContent = day;
    cell.appendChild(num);

    const stack = document.createElement("div");
    stack.className = "stack";

    eventsOn(iso(d)).forEach(e => {
      const b = document.createElement("button");
      b.className = "ev";
      b.innerHTML = `<span class="t">${e.title}</span>` + (e.time_text ? `<span class="h">${e.time_text}</span>`:"");
      b.onclick = ev => popover(ev.currentTarget, e, d);
      stack.appendChild(b);
    });

    const regs = regularsOn(DOW[mondayIndex(d)]);
    if(regs.length){
      const box = document.createElement("div");
      box.className = "regs";
      regs.forEach(x => {
        const r = document.createElement("div");
        r.className = "regular";
        r.innerHTML = `<span class="tick"></span><span class="r-t">${x.title}` +
          (x.time_text ? `<span class="r-h">${x.time_text}</span>` : "") + `</span>`;
        r.title = x.time_text ? `${x.title} (${x.time_text})` : x.title;
        box.appendChild(r);
      });
      stack.appendChild(box);
    }

    cell.appendChild(stack);
    grid.appendChild(cell);
    stacks.push(stack);
  }
  stacks.forEach(fitCell);
}

// How tall we'll let a day's contents grow before shortening them. Cells share
// a row height, so one very full day would otherwise stretch the whole week.
const CELL_CONTENT_CAP = 150;

function contentHeight(stack){
  // .stack is stretched to the row height, so measure the children instead.
  const kids = Array.from(stack.children);
  return kids.reduce((h, c) => h + c.offsetHeight, 0) + Math.max(0, kids.length - 1) * 5;
}

function fitCell(stack){
  for(const level of ["stack", "stack tight-1", "stack tight-2"]){
    stack.className = level;
    if(contentHeight(stack) <= CELL_CONTENT_CAP) return;
  }
}

function renderAgenda(){
  const wrap = document.getElementById("agenda");
  wrap.innerHTML = "";
  const daysIn = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
  let any = false;
  for(let day=1; day<=daysIn; day++){
    const d = new Date(view.getFullYear(), view.getMonth(), day);
    eventsOn(iso(d)).forEach(e => {
      any = true;
      const row = document.createElement("button");
      row.className = "day"; row.style.cursor = "pointer";
      row.style.textAlign = "left"; row.style.font = "inherit"; row.style.color = "inherit";
      row.innerHTML =
        `<div class="d-when"><div class="d-dow">${DOW[mondayIndex(d)].slice(0,3)}</div>`+
        `<div class="d-num">${day}</div></div>`+
        `<div class="d-body"><div class="t">${e.title}</div>`+
        `<div class="h">${e.time_text||""}</div></div>`;
      row.onclick = ev => popover(ev.currentTarget, e, d);
      wrap.appendChild(row);
    });
  }
  if(!any){
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = "No one-off events listed this month. See the weekly activities below.";
    wrap.appendChild(p);
  }
}

function renderWeekly(){
  const ul = document.getElementById("weekly");
  ul.innerHTML = "";
  DATA.events.filter(e => e.kind === "recurring").forEach(e => {
    const li = document.createElement("li");
    if(isSuspended(e)) li.className = "off";
    const note = recurringNote(e);
    li.innerHTML =
      `<div class="w-t">${e.title}${isSuspended(e)?'<span class="tag">Suspended</span>':''}</div>`+
      `<div class="w-m">${e.weekday}s${e.time_text ? " &middot; "+e.time_text : ""}</div>`+
      (note ? `<div class="w-note">${note}</div>` : "");
    ul.appendChild(li);
  });
}

let openPop;
function closePop(){ if(openPop){ openPop.remove(); openPop=null; } }
function popover(anchor, e, d){
  closePop();
  const back = document.createElement("div");
  back.className = "backdrop"; back.onclick = closePop;
  const pop = document.createElement("div");
  pop.className = "pop";
  const dateStr = d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const detail = (e.raw||"").split(" / ").slice(2).join(" ").replace(/\s+/g," ").trim();
  pop.innerHTML =
    `<button class="x" aria-label="Close">&times;</button>`+
    `<h4>${e.title}</h4>`+
    `<div class="when">${dateStr}${e.time_text ? " &middot; "+e.time_text : ""}</div>`+
    (detail ? `<p>${detail}</p>` : "");
  document.body.appendChild(back);
  document.body.appendChild(pop);
  pop.querySelector(".x").onclick = closePop;
  // position near the anchor, kept on-screen
  const r = anchor.getBoundingClientRect();
  const pw = Math.min(320, window.innerWidth*0.88);
  let left = Math.min(r.left, window.innerWidth - pw - 12);
  let top = r.bottom + 8;
  if(top + 180 > window.innerHeight) top = Math.max(12, r.top - 180);
  pop.style.left = Math.max(12,left) + "px";
  pop.style.top = top + "px";
  openPop = { remove(){ pop.remove(); back.remove(); } };
}
document.addEventListener("keydown", e => { if(e.key === "Escape") closePop(); });

load();
</script>
</body>
</html>
